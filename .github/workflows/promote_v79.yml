name: Promote Breakage Monitoring v79
on:
  push:
    paths:
      - 'export_photos_v79.js'
      - '.github/workflows/promote_v79.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject export photo patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/export_photos_v79.js?v=20260909"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit production index
        run: |
          git config user.name "bentttt87"
          git config user.email "bentttt87@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: enable Excel export with evidence photos v79"
          git push
