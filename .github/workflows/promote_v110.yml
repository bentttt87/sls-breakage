name: Promote Breakage Multi Filter v111
on:
  push:
    branches: [main]
    paths:
      - 'period_view_v110.js'
      - '.github/workflows/promote_v110.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote v111 multi-filter script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/period_view_v110.js?v=20260916"></script>'
          new='<script src="/period_view_v110.js?v=20260916v111"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('</body>',new+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit production index
        run: |
          git config user.name "bentttt87"
          git config user.email "bentttt87@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: enable multi-select year month RDC filters v111"
          git push
