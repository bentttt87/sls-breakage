<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BA + Foto - SLS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:Arial,sans-serif;color:#111}.toolbar{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;justify-content:center;background:#fff;padding:10px;border-bottom:1px solid #ddd}.toolbar button{padding:10px 16px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.primary{background:#063a76;color:#fff}.primary:disabled{opacity:.5}.secondary{background:#fff;color:#183b62;border:1px solid #8da4bd!important}.status{font-size:11px;color:#667085}.paper,.evpage{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:11mm 10mm 13mm;box-shadow:0 4px 24px rgba(0,0,0,.12)}.head{display:grid;grid-template-columns:42mm 1fr 34mm;gap:4mm;align-items:start}.logo img{width:38mm;max-height:25mm;object-fit:contain}.title{text-align:center;padding-top:3mm}.title h1{font-size:14pt;margin:0 0 2mm}.title h2{font-size:11pt;margin:0}.ref{text-align:right;font-size:7.5pt;line-height:1.35}.meta{width:80%;margin:5mm auto 7mm;border-collapse:collapse;font-size:10pt}.meta td{padding:1.5mm 1mm}.meta .l{width:43mm;font-weight:700}.meta .c{width:5mm;text-align:center}.meta .v{border-bottom:1px solid #222}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}.items th,.items td{border:1px solid #111;padding:2mm 1.4mm}.items th{text-align:center}.items td:nth-child(1),.items td:nth-child(4),.items td:nth-child(5){text-align:center}.chron{margin-top:7mm;font-size:10pt}.chron .line{min-height:8mm;border-bottom:1px solid #222;padding:1mm}.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;margin-top:9mm;font-size:9.5pt;text-align:center}.space{height:22mm}.name{text-align:left;padding-left:7mm}.foot{text-align:right;font-size:7.5pt;color:#666;margin-top:6mm}.evpage{page-break-before:always;break-before:page}.evhead{display:flex;gap:8mm;align-items:center;border-bottom:1px solid #aaa;padding-bottom:4mm;margin-bottom:5mm}.evhead img{width:34mm;max-height:22mm;object-fit:contain}.evhead h2{font-size:14pt;margin:0}.evhead p{font-size:9pt;color:#555;margin:1mm 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.card{border:1px solid #bbb;border-radius:3mm;padding:3mm;break-inside:avoid}.card img{width:100%;height:93mm;object-fit:contain;background:#f7f7f7}.cap{font-size:8.5pt;line-height:1.35;margin-top:2mm}.cap b{display:block;font-size:9pt}.err{height:93mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:8mm;background:#fff3f1;color:#b42318;border:1px dashed #e0a09a}@media print{body{background:#fff}.toolbar{display:none}.paper,.evpage{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}.evpage{page-break-before:always}.card,.sigs{page-break-inside:avoid}}@media(max-width:900px){.paper,.evpage{width:100%;min-height:auto;margin:0;padding:18px;box-shadow:none}.head{grid-template-columns:34mm 1fr}.ref{grid-column:1/-1;text-align:left}.grid{grid-template-columns:1fr}.card img{height:auto;max-height:70vh}.toolbar{position:relative;flex-wrap:wrap}}
</style></head><body>
<div class="toolbar"><button id="save" class="primary" disabled>⬇ Download / Save 1 PDF (BA + Foto)</button><span id="status" class="status">Memuat foto…</span><button class="secondary" onclick="window.close()">Tutup</button></div><div id="ba"></div><div id="ev"></div>
<script>
(async()=>{
const BRAND='https://raw.githubusercontent.com/bentttt87/sls-wms/main/quadra-roman-logo.svg?v=20260914-1617',SB='https://mfdckngkvjnemwgmkiiv.supabase.co',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZGNrbmdrdmpuZW13Z21raWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDcxMjUsImV4cCI6MjEwMTU4MzEyNX0.mFhv9hgQvjzg6AYfmEI2GiJ71I2xSkOozC43mwFcogU';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const qp=new URLSearchParams(location.search),k=qp.get('k');let d=null;try{d=JSON.parse(localStorage.getItem(k)||'null')}catch(_){};const ba=document.getElementById('ba'),ev=document.getElementById('ev'),st=document.getElementById('status'),save=document.getElementById('save');if(!d){ba.innerHTML='<div style="margin:40px;padding:20px;background:#fff;color:#b42318">Data BA tidak ditemukan.</div>';st.textContent='Data tidak tersedia';return}
const fmtDate=v=>{if(!v)return'—';return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(v+'T00:00:00'))},cleanDriver=(n,p)=>{n=String(n||'').trim();p=String(p||'').trim();if(p&&n.toUpperCase().startsWith(p.toUpperCase()+' - '))n=n.slice(p.length+3);return n||'—'};let items=d.items||[],refs=[...new Set(items.map(x=>x.no_ba).filter(Boolean))];if(!refs.length&&Array.isArray(d.refs))refs=d.refs;let rows=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.item_code||'')}</td><td>${esc(x.ceramic_series||'')}</td><td>${esc(x.qty_box??'')}</td><td>${esc(x.uom||'BOX')}</td><td>${esc([x.cause,x.cause_detail].filter(Boolean).join(' - '))}</td></tr>`);while(rows.length<5)rows.push(`<tr><td>${rows.length+1}</td><td style="height:9mm"></td><td></td><td></td><td></td><td></td></tr>`);let receiver=d.receiver_name||items.find(x=>x.ba_receiver_name)?.ba_receiver_name||d.customer||'',witness=d.witness_name||items.find(x=>x.ba_witness_name)?.ba_witness_name||'',chron=[...new Set(items.map(x=>[x.cause,x.cause_detail].filter(Boolean).join(' - ')).filter(Boolean))].join('; ');
ba.innerHTML=`<main class="paper"><div class="head"><div class="logo"><img src="${BRAND}" alt="QUADRA ROMAN"></div><div class="title"><h1>BERITA ACARA KEPECAHAN PENGIRIMAN</h1><h2>RDC ${esc(String(d.rdc||'').toUpperCase())}</h2></div><div class="ref"><b>Referensi BA Sistem</b><br>${esc(refs.join(', ')||'—')}</div></div><table class="meta"><tr><td class="l">Tanggal Pemeriksaan</td><td class="c">:</td><td class="v">${esc(fmtDate(d.occurrence_date))}</td></tr><tr><td class="l">Nama Penerima</td><td class="c">:</td><td class="v">${esc(receiver)}</td></tr><tr><td class="l">No. Surat Jalan</td><td class="c">:</td><td class="v">${esc(d.no_sj||'')}</td></tr><tr><td class="l">Pabrik Asal</td><td class="c">:</td><td class="v">${esc(d.factory||'')}</td></tr><tr><td class="l">Nama Ekspedisi</td><td class="c">:</td><td class="v">${esc(d.transporter||'')}</td></tr><tr><td class="l">Nama Pengemudi</td><td class="c">:</td><td class="v">${esc(cleanDriver(d.driver_name,d.vehicle_no))}</td></tr><tr><td class="l">No. Polisi Armada</td><td class="c">:</td><td class="v">${esc(d.vehicle_no||'')}</td></tr></table><table class="items"><thead><tr><th>No</th><th>Motif</th><th>Seri</th><th>Jumlah Pecah</th><th>Satuan<br>(Box/PC)</th><th>Keterangan / Kondisi Kerusakan</th></tr></thead><tbody>${rows.join('')}</tbody></table><div class="chron"><b>Kronologi Singkat Kejadian:</b><div class="line">${esc(chron)}</div><div class="line"></div></div><div class="sigs"><div>Pihak I (Penerima Gudang)<div class="space"></div>( ____________________ )<div class="name">Nama: ${esc(receiver)}</div></div><div>Pihak II (Driver Ekspedisi)<div class="space"></div>( ____________________ )<div class="name">Nama: ${esc(cleanDriver(d.driver_name,d.vehicle_no)==='—'?'':cleanDriver(d.driver_name,d.vehicle_no))}</div></div><div>Saksi Pemeriksa<div class="space"></div>( ____________________ )<div class="name">Nama: ${esc(witness)}</div></div></div><div class="foot">Dicetak dari SLS Breakage Monitoring · ${esc(new Date().toLocaleString('id-ID'))}</div></main>`;
function sess(){for(const key of ['sls_breakage_session','sls_breakage_input_session']){try{const s=JSON.parse(sessionStorage.getItem(key)||'null');if(s?.access_token)return s}catch(_){}}return null}async function tok(){let s=sess();if(!s)return null;if(s.expires_at&&Number(s.expires_at)*1000<Date.now()+30000&&s.refresh_token){try{let r=await fetch(`${SB}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(r.ok){let n=await r.json();s={...s,...n};let key=sessionStorage.getItem('sls_breakage_session')?'sls_breakage_session':'sls_breakage_input_session';sessionStorage.setItem(key,JSON.stringify(s))}}catch(_){}}return s.access_token}async function purl(path){let t=await tok();if(!t)throw Error('Sesi login tidak ditemukan');let r=await fetch(`${SB}/storage/v1/object/authenticated/breakage-evidence/${String(path).split('/').map(encodeURIComponent).join('/')}`,{headers:{apikey:ANON,Authorization:`Bearer ${t}`}});if(!r.ok)throw Error('Foto tidak dapat dimuat');return URL.createObjectURL(await r.blob())}
let ph=[];items.forEach(it=>(Array.isArray(it.photo_paths)?it.photo_paths:[]).forEach((p,i)=>ph.push({path:p,incident_no:it.incident_no,item_code:it.item_code,series:it.ceramic_series,index:i+1})));if(!ph.length){st.textContent='BA siap. Tidak ada lampiran foto.';save.disabled=false;save.onclick=()=>print();return}let loaded=[];for(let i=0;i<ph.length;i++){try{loaded.push({...ph[i],url:await purl(ph[i].path),ok:true})}catch(e){loaded.push({...ph[i],ok:false,error:String(e.message||e)})}st.textContent=`Memuat foto ${i+1}/${ph.length}…`}for(let s=0;s<loaded.length;s+=4){let c=loaded.slice(s,s+4),pg=document.createElement('section');pg.className='evpage';pg.innerHTML=`<div class="evhead"><img src="${BRAND}" alt="QUADRA ROMAN"><div><h2>LAMPIRAN FOTO EVIDENCE</h2><p>BA ${esc(refs[0]||'—')} · RDC ${esc(String(d.rdc||'').toUpperCase())} · ${esc(fmtDate(d.occurrence_date))}</p></div></div><div class="grid">${c.map((p,j)=>`<div class="card">${p.ok?`<img src="${p.url}" alt="Evidence ${s+j+1}">`:`<div class="err">${esc(p.error)}</div>`}<div class="cap"><b>Foto ${s+j+1} · ${esc(p.incident_no||'')}</b>Item: ${esc(p.item_code||'—')} · Series: ${esc(p.series||'—')}<br>Evidence ${esc(p.index)}</div></div>`).join('')}</div>`;ev.appendChild(pg)}await Promise.all([...ev.querySelectorAll('img')].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));let fail=loaded.filter(x=>!x.ok).length;st.textContent=fail?`BA siap; ${fail} foto gagal dimuat.`:`BA + ${loaded.length} foto siap menjadi 1 PDF.`;save.disabled=false;save.onclick=()=>print();
})();
</script></body></html>
